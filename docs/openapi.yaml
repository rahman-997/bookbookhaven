openapi: 3.1.0
info:
  title: BookHaven API
  version: 4.0.0
  description: REST API for BookHaven authentication, catalog, cart, wishlist, reviews, orders and administration.
servers:
  - url: http://localhost:3001/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
    Pagination:
      type: object
      required: [page, limit, total, pages]
      properties:
        page: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        total: { type: integer, minimum: 0 }
        pages: { type: integer, minimum: 1 }
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, admin] }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthSession:
      type: object
      required: [user, token, expiresInSeconds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
        expiresInSeconds: { type: integer, minimum: 1 }
    Book:
      type: object
      required: [_id, title, slug, author, description, price, stock, categories, featured]
      properties:
        _id: { type: string }
        title: { type: string, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        author: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        coverUrl: { type: string, format: uri, pattern: '^https://' }
        isbn:
          type: string
          description: Normalized ISBN-10 or ISBN-13. Spaces and hyphens are removed, letters are uppercased, and the checksum is validated before persistence.
          examples: ['9780306406157', '0306406152']
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        categories: { type: array, maxItems: 20, items: { type: string, maxLength: 80 } }
        featured: { type: boolean }
    BookInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        author: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        coverUrl: { type: string, format: uri, pattern: '^https://' }
        isbn:
          type: string
          description: Valid ISBN-10 or ISBN-13; spaces and hyphens are accepted and normalized.
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        categories: { type: array, maxItems: 20, items: { type: string, minLength: 1, maxLength: 80 } }
        featured: { type: boolean }
    CartAddInput:
      type: object
      required: [bookId, quantity]
      properties:
        bookId: { type: string }
        quantity: { type: integer, minimum: 1 }
    CartQuantityInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000, default: '' }
    OrderInput:
      type: object
      required: [shippingAddress]
      properties:
        shippingAddress: { type: string, minLength: 10, maxLength: 500 }
        paymentMethod: { type: string, enum: [cash_on_delivery, manual], default: cash_on_delivery }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, confirmed, shipped, completed, cancelled] }
paths:
  /health:
    get:
      summary: Service and database readiness
      responses:
        '200': { description: Service ready }
        '503': { description: Database unavailable }
  /auth/register:
    post:
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterInput' }
      responses:
        '201': { description: Registered session }
        '400': { description: Validation error }
        '409': { description: Email already registered }
  /auth/login:
    post:
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200': { description: Authenticated session }
        '400': { description: Validation error }
        '401': { description: Invalid credentials }
  /auth/me:
    get:
      summary: Current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Authentication required }
  /books:
    get:
      summary: Search, filter, sort and paginate books
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: author, schema: { type: string, maxLength: 160 } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: featured, schema: { type: string, enum: ['true', 'false'] } }
        - { in: query, name: minPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, oldest, price_asc, price_desc, title], default: newest } }
      responses:
        '200': { description: Book list with pagination metadata }
        '400': { description: Invalid query, including minPrice greater than maxPrice }
    post:
      summary: Create a book
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/BookInput' }
              required: [title, slug, author, price]
      responses:
        '201': { description: Created }
        '400': { description: Validation error, including invalid ISBN checksum or non-HTTPS cover URL }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '409': { description: Duplicate slug or ISBN }
  /books/slug/{slug}:
    get:
      summary: Get a book by slug
      parameters:
        - { in: path, name: slug, required: true, schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' } }
      responses:
        '200': { description: Book }
        '400': { description: Invalid slug }
        '404': { description: Book not found }
  /books/{id}:
    get:
      summary: Get a book by ID
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Book }
        '400': { description: Invalid object ID }
        '404': { description: Book not found }
    patch:
      summary: Update a book
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookInput' }
      responses:
        '200': { description: Updated }
        '400': { description: Invalid ID/body or invalid ISBN checksum }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '404': { description: Book not found }
        '409': { description: Duplicate slug or ISBN }
    delete:
      summary: Delete a book and clean cart, wishlist and review references
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '400': { description: Invalid object ID }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '404': { description: Book not found }
        '409': { description: Book is referenced by a pending or confirmed order }
  /cart:
    get:
      summary: Get current persistent cart
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Cart with subtotal }
        '401': { description: Authentication required }
    delete:
      summary: Clear current cart
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cart cleared }
        '401': { description: Authentication required }
        '409': { description: Cart locked during checkout }
  /cart/items:
    post:
      summary: Add an item to the cart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartAddInput' }
      responses:
        '201': { description: Updated cart }
        '400': { description: Validation error }
        '401': { description: Authentication required }
        '404': { description: Book not found }
        '409': { description: Insufficient stock, active checkout lock, or concurrent cart conflict }
  /cart/items/{bookId}:
    patch:
      summary: Update cart quantity
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CartQuantityInput' }
      responses:
        '200': { description: Updated cart }
        '400': { description: Invalid ID/body }
        '401': { description: Authentication required }
        '404': { description: Cart item or book not found }
        '409': { description: Insufficient stock, active checkout lock, or concurrent cart conflict }
    delete:
      summary: Remove a cart item
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
      responses:
        '200': { description: Updated cart }
        '400': { description: Invalid object ID }
        '401': { description: Authentication required }
        '404': { description: Cart item not found }
        '409': { description: Cart locked during checkout }
  /wishlist:
    get:
      summary: Get current wishlist
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Wishlist }
        '401': { description: Authentication required }
  /wishlist/{bookId}:
    post:
      summary: Add a book to the wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
      responses:
        '201': { description: Wishlist updated }
        '400': { description: Invalid object ID }
        '401': { description: Authentication required }
        '404': { description: Book not found }
    delete:
      summary: Remove a book from the wishlist
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
      responses:
        '200': { description: Wishlist updated }
        '400': { description: Invalid object ID }
        '401': { description: Authentication required }
  /reviews/book/{bookId}:
    get:
      summary: Paginated reviews for a book
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Review page plus averageRating, count and pagination metadata }
        '400': { description: Invalid book ID or pagination }
    put:
      summary: Create or update the current user's review
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewInput' }
      responses:
        '201': { description: Review saved }
        '400': { description: Invalid book ID or review body }
        '401': { description: Authentication required }
        '404': { description: Book not found }
  /reviews/{id}:
    delete:
      summary: Delete own review or any review as admin
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '400': { description: Invalid object ID }
        '401': { description: Authentication required }
        '403': { description: Cannot delete another user's review }
        '404': { description: Review not found }
  /orders:
    get:
      summary: Paginated current-user order history
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, confirmed, shipped, completed, cancelled] } }
      responses:
        '200': { description: Orders with pagination metadata }
        '400': { description: Invalid pagination/status filter }
        '401': { description: Authentication required }
    post:
      summary: Checkout the current cart
      description: Uses a MongoDB transaction on replica-set/sharded deployments and a compensation fallback on standalone MongoDB.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderInput' }
      responses:
        '201': { description: Order created; stock decremented and cart cleared }
        '400': { description: Invalid request or empty cart }
        '401': { description: Authentication required }
        '409': { description: Checkout already in progress, unavailable book, insufficient stock, or stock changed concurrently }
  /orders/{id}:
    get:
      summary: Current user's owned order detail
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: Owned order detail }
        '400': { description: Invalid order ID }
        '401': { description: Authentication required }
        '404': { description: Order not found or not owned by current user }
  /orders/admin/all:
    get:
      summary: Search, filter and paginate all orders
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, confirmed, shipped, completed, cancelled] } }
        - { in: query, name: search, description: Escaped bounded search across order ID, customer name/email, shipping address and book title, schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: Admin orders with pagination metadata }
        '400': { description: Invalid query }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
  /orders/admin/{id}/status:
    patch:
      summary: Transition order status
      description: Valid transitions are pending→confirmed, confirmed→shipped, shipped→completed, and pending/confirmed→cancelled. Cancellation restores inventory once; transaction-capable MongoDB performs status/restock atomically.
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrderStatusInput' }
      responses:
        '200': { description: Updated order }
        '400': { description: Invalid order ID/body }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
        '404': { description: Order not found }
        '409': { description: Invalid/concurrent transition or inventory restore failure }
  /admin/stats:
    get:
      summary: Admin dashboard metrics
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Book/user/order/review counts, low stock, order value and recent orders }
        '401': { description: Authentication required }
        '403': { description: Admin role required }
