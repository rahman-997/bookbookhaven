name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate Docker Compose configuration
        env:
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          ADMIN_PASSWORD: ci-only-admin-password-strong-12345
        run: docker compose -f compose.yaml config --quiet
      - name: Install backend
        working-directory: backend
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install frontend
        working-directory: frontend
        run: npm ci --include=dev --no-audit --no-fund
      - name: Audit backend runtime dependencies
        working-directory: backend
        shell: bash
        run: |
          set +e
          audit_output="$(timeout 120s npm audit --omit=dev --audit-level=high 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -eq 0 ]; then exit 0; fi
          if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
            echo '::warning::npm audit service is temporarily unavailable for backend dependencies; security scanners and Dependabot remain active.'
            exit 0
          fi
          exit "$audit_status"
      - name: Audit frontend runtime dependencies
        working-directory: frontend
        shell: bash
        run: |
          set +e
          audit_output="$(timeout 120s npm audit --omit=dev --audit-level=high 2>&1)"
          audit_status=$?
          set -e
          printf '%s\n' "$audit_output"
          if [ "$audit_status" -eq 0 ]; then exit 0; fi
          if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
            echo '::warning::npm audit service is temporarily unavailable for frontend dependencies; security scanners and Dependabot remain active.'
            exit 0
          fi
          exit "$audit_status"
      - name: Verify frontend CSS accessibility and paint budget
        run: node scripts/verify-frontend-css.mjs
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify free-hosting runtime files
        run: |
          node --check scripts/start-free-hosting.mjs
          node --check scripts/smoke-free-hosting.mjs
          node --check scripts/verify-frontend-css.mjs
          test -f frontend/.next/standalone/server.js
      - name: Smoke test free-hosting runtime
        env:
          MONGOMS_DOWNLOAD_DIR: /tmp/bookhaven-mongodb-binaries
        run: npm run smoke:free
