name: Refresh backend security lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: bookhaven-security-lock-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/qs-6-16-0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout security branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}

      - name: Use repository Node version
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Regenerate backend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched dependency and backend
        run: |
          npm ci --include=dev --no-audit --no-fund
          node -e "const q=require('qs/package.json'); if(q.version!=='6.16.0') throw new Error('Expected qs 6.16.0, got '+q.version); console.log('qs', q.version)"
          npm audit --omit=dev --audit-level=moderate
          npm run typecheck
          npm test
          npm run build

      - name: Commit regenerated backend lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Backend lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate backend lockfile for qs 6.16.0'
          git push origin HEAD:${GITHUB_HEAD_REF}
