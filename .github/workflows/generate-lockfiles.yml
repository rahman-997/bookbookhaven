name: Generate lockfiles

on:
  push:
    branches:
      - bookhaven-phase-5-lockfiles
    paths:
      - '.github/workflows/generate-lockfiles.yml'

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate backend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
      - name: Generate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package-lock.json frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current"
          else
            git commit -m "Add deterministic npm lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
