name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Validate Docker Compose configuration
        env:
          JWT_SECRET: ci-only-jwt-secret-with-at-least-32-characters
          ADMIN_PASSWORD: ci-only-admin-password-strong-12345
        run: docker compose -f compose.yaml config --quiet
      - name: Install backend
        working-directory: backend
        run: npm ci --include=dev --no-audit --no-fund
      - name: Install frontend
        working-directory: frontend
        run: npm ci --include=dev --no-audit --no-fund
      - name: Audit runtime dependencies
        shell: bash
        run: |
          set -euo pipefail

          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT

          start_audit() {
            local key="$1"
            local directory="$2"
            shift 2

            (
              set +e
              cd "$directory"
              timeout 120s "$@" > "$audit_dir/$key.out" 2>&1
              printf '%s\n' "$?" > "$audit_dir/$key.status"
            ) &
          }

          check_audit() {
            local key="$1"
            local label="$2"
            local audit_status
            local audit_output

            audit_status="$(cat "$audit_dir/$key.status")"
            audit_output="$(cat "$audit_dir/$key.out")"
            echo "::group::$label"
            printf '%s\n' "$audit_output"
            echo '::endgroup::'

            if [ "$audit_status" -eq 0 ]; then
              return 0
            fi

            if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              echo "::warning::$label could not reach the npm audit service; security scanners and Dependabot remain active, so CI will not fail on this external outage."
              return 0
            fi

            return "$audit_status"
          }

          start_audit backend backend npm audit --omit=dev --audit-level=high
          start_audit frontend frontend npm audit --omit=dev --audit-level=high
          wait

          audit_failed=0
          check_audit backend 'Backend runtime dependency audit' || audit_failed=1
          check_audit frontend 'Frontend runtime dependency audit' || audit_failed=1
          exit "$audit_failed"
      - name: Verify frontend CSS accessibility and paint budget
        run: node scripts/verify-frontend-css.mjs
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck
      - name: Test backend
        working-directory: backend
        run: npm test
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Verify free-hosting runtime files
        run: |
          node --check scripts/start-free-hosting.mjs
          node --check scripts/smoke-free-hosting.mjs
          node --check scripts/verify-frontend-css.mjs
          test -f frontend/.next/standalone/server.js
      - name: Smoke test free-hosting runtime
        env:
          MONGOMS_DOWNLOAD_DIR: /tmp/bookhaven-mongodb-binaries
        run: npm run smoke:free
