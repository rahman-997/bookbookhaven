openapi: 3.1.0
info:
  title: BookHaven API
  version: 4.1.0
  description: Production-oriented REST API for BookHaven commerce, catalog, reader state and administration.
servers:
  - url: http://localhost:3001/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: {}
    User:
      type: object
      required: [id, name, email, role]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [customer, admin] }
    AuthInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    RegisterInput:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, maxLength: 120 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
    AuthSession:
      type: object
      required: [user, token, expiresInSeconds]
      properties:
        user: { $ref: '#/components/schemas/User' }
        token: { type: string }
        expiresInSeconds: { type: integer, minimum: 1 }
    Book:
      type: object
      required: [_id, title, slug, author, description, price, stock, categories, featured]
      properties:
        _id: { type: string }
        title: { type: string, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        author: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        coverUrl: { type: string, format: uri, pattern: '^https://' }
        isbn: { type: string, description: Normalized ISBN-10 or ISBN-13 without spaces/hyphens. }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        categories: { type: array, maxItems: 20, items: { type: string } }
        featured: { type: boolean }
    BookInput:
      type: object
      properties:
        title: { type: string, maxLength: 200 }
        slug: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        author: { type: string, maxLength: 160 }
        description: { type: string, maxLength: 5000 }
        coverUrl: { type: string, format: uri, pattern: '^https://' }
        isbn: { type: string }
        price: { type: number, minimum: 0 }
        stock: { type: integer, minimum: 0 }
        categories: { type: array, maxItems: 20, items: { type: string } }
        featured: { type: boolean }
    CartAddInput:
      type: object
      required: [bookId, quantity]
      properties:
        bookId: { type: string }
        quantity: { type: integer, minimum: 1 }
    CartQuantityInput:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1 }
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, maxLength: 2000 }
    OrderInput:
      type: object
      required: [shippingAddress]
      properties:
        shippingAddress: { type: string, minLength: 10, maxLength: 500 }
        paymentMethod: { type: string, enum: [cash_on_delivery, manual], default: cash_on_delivery }
    OrderStatusInput:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, confirmed, shipped, completed, cancelled] }
paths:
  /health:
    get:
      summary: Service health/readiness
      responses:
        '200': { description: Healthy and MongoDB connected }
        '503': { description: Database unavailable }
  /auth/register:
    post:
      summary: Register a customer
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RegisterInput' } } }
      responses:
        '201': { description: Registered; includes JWT for trusted server/BFF use }
        '400': { description: Validation error }
        '409': { description: Email already registered }
  /auth/login:
    post:
      summary: Authenticate
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AuthInput' } } }
      responses:
        '200': { description: Authenticated; includes JWT for trusted server/BFF use }
        '401': { description: Invalid credentials }
  /auth/me:
    get:
      summary: Current authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Current user }
        '401': { description: Authentication required }
  /books:
    get:
      summary: Paginated catalog search/filter/sort
      parameters:
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: author, schema: { type: string, maxLength: 160 } }
        - { in: query, name: category, schema: { type: string, maxLength: 80 } }
        - { in: query, name: featured, schema: { type: boolean } }
        - { in: query, name: minPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: maxPrice, schema: { type: number, minimum: 0 } }
        - { in: query, name: sort, schema: { type: string, enum: [newest, oldest, price_asc, price_desc, title] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Book array plus pagination metadata }
        '400': { description: Invalid filters }
    post:
      summary: Create book (admin)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/BookInput' }], required: [title, slug, author, price] } } }
      responses:
        '201': { description: Created }
        '400': { description: Validation or invalid ISBN }
        '403': { description: Admin required }
        '409': { description: Duplicate slug or ISBN }
  /books/slug/{slug}:
    get:
      summary: Get book by slug
      parameters: [{ in: path, name: slug, required: true, schema: { type: string } }]
      responses:
        '200': { description: Book }
        '404': { description: Not found }
  /books/{id}:
    get:
      summary: Get book by id
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: Book }
        '404': { description: Not found }
    patch:
      summary: Partially update book (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/BookInput' } } }
      responses:
        '200': { description: Updated }
        '400': { description: Validation error }
        '403': { description: Admin required }
        '409': { description: Duplicate slug or ISBN }
    delete:
      summary: Delete book and clean cart/wishlist/review references (admin)
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '403': { description: Admin required }
  /cart:
    get:
      summary: Persistent cart
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Cart and subtotal } }
    delete:
      summary: Clear cart
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Cleared }
        '409': { description: Cart locked during checkout }
  /cart/items:
    post:
      summary: Add item with stock and concurrency validation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartAddInput' } } }
      responses:
        '201': { description: Updated cart }
        '409': { description: Insufficient stock, lock, or write conflict }
  /cart/items/{bookId}:
    patch:
      summary: Update quantity
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: bookId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CartQuantityInput' } } }
      responses:
        '200': { description: Updated cart }
        '409': { description: Insufficient stock, lock, or write conflict }
    delete:
      summary: Remove item
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: bookId, required: true, schema: { type: string } }]
      responses:
        '200': { description: Updated cart }
        '409': { description: Cart locked or write conflict }
  /wishlist:
    get:
      summary: Current wishlist
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Wishlist } }
  /wishlist/{bookId}:
    post:
      summary: Add book without duplicates
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: bookId, required: true, schema: { type: string } }]
      responses: { '201': { description: Saved } }
    delete:
      summary: Remove saved book
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: bookId, required: true, schema: { type: string } }]
      responses: { '200': { description: Removed } }
  /reviews/book/{bookId}:
    get:
      summary: Paginated reviews plus aggregate rating/count
      parameters:
        - { in: path, name: bookId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses: { '200': { description: Reviews with aggregate and pagination metadata } }
    put:
      summary: Create or update own single review
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: bookId, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ReviewInput' } } }
      responses: { '201': { description: Review saved } }
  /reviews/{id}:
    delete:
      summary: Delete own review or any review as admin
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '403': { description: Not owner/admin }
  /orders:
    get:
      summary: Current user's order history
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Orders } }
    post:
      summary: Checkout current cart
      description: Locks the cart, validates and atomically decrements stock. Uses MongoDB transactions on replica-set/sharded deployments and compensation fallback on standalone MongoDB.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderInput' } } }
      responses:
        '201': { description: Order created }
        '400': { description: Empty cart }
        '409': { description: Checkout in progress, unavailable item, or stock changed }
  /orders/{id}:
    get:
      summary: Current user's order detail
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses:
        '200': { description: Owned order }
        '404': { description: Not found or not owned by current user }
  /orders/admin/all:
    get:
      summary: Paginated/searchable admin order queue
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { in: query, name: status, schema: { type: string, enum: [pending, confirmed, shipped, completed, cancelled] } }
        - { in: query, name: search, description: Order id, reader name/email, item title or shipping address., schema: { type: string, maxLength: 120 } }
      responses:
        '200': { description: Orders plus pagination metadata }
        '403': { description: Admin required }
  /orders/admin/{id}/status:
    patch:
      summary: Apply a guarded order state transition
      security: [{ bearerAuth: [] }]
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/OrderStatusInput' } } }
      responses:
        '200': { description: Updated order }
        '409': { description: Invalid/concurrent transition or inventory restore failure }
  /admin/stats:
    get:
      summary: Dashboard statistics and recent orders
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Books/users/orders/reviews/low-stock/order-value/recent-orders }
        '403': { description: Admin required }
