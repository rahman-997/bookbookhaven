name: Generate lockfiles

on:
  push:
    branches:
      - bookhaven-phase-5-lockfiles
    paths:
      - '.github/workflows/generate-lockfiles.yml'

permissions:
  contents: read

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Generate backend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix backend
      - name: Generate frontend lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix frontend
      - name: Upload lockfiles
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bookhaven-lockfiles
          path: |
            backend/package-lock.json
            frontend/package-lock.json
          if-no-files-found: error
          retention-days: 1
